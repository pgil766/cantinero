# Cantinero: servicios de desarrollo local.
# En producción (VM de Azure) se combina con docker-compose.prod.yml (Fase 8).
#
# Uso:
#   docker compose up -d postgres keycloak      # infraestructura (el backend corre nativo con uvicorn)
#   docker compose up -d --build                # todo en Docker, incluido el backend

name: cantinero

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
      # Leídas por db/init/01-init.sh
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde el propio equipo
    healthcheck:
      # -h 127.0.0.1: durante el init el servidor temporal solo escucha por socket, así que
      # el chequeo por TCP no da "sano" hasta que el init terminó y Postgres arrancó de verdad.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # LLM y embeddings. Perfil "ollama": en local NO se levanta por defecto porque Ollama corre nativo en
  # Windows (usa la GPU). En la VM se levanta con:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:0.34.3
    profiles: ["ollama"]
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Sano solo cuando ya descargó los dos modelos
      test: ["CMD-SHELL", "ollama list | grep -q \"$${LLM_MODEL}\" && ollama list | grep -q \"$${EMBEDDING_MODEL}\""]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    # Solo las variables que el backend necesita (§15.2). No se usa env_file: así el contenedor
    # no recibe las contraseñas de superusuario de Postgres ni las de Keycloak.
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Dentro de Docker los servicios se alcanzan por su nombre, no por localhost/127.0.0.1
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080${KC_HTTP_RELATIVE_PATH}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      # En local, Ollama corre nativo en Windows (usa la GPU); en la VM, el override de producción
      # lo cambia por el servicio "ollama".
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux; en Docker Desktop ya existe
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama_models:
